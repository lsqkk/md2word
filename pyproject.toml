[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "md2word"
version = "1.3.0"
description = "Convert Markdown to Word (.docx) — templates, footnotes, cross-refs, math, mermaid"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.0",
    "markdown>=3.5",
    "Pillow>=10",
    "requests>=2.28",
]

[project.optional-dependencies]
svg = ["resvg>=0.2"]
highlight = ["pygments>=2.17"]
math = ["matplotlib>=3.7", "latex2mathml>=3.80"]
watch = ["watchdog>=3.0"]
all = ["md2word[svg,highlight,math,watch]"]

[project.scripts]
md2word = "md2word.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["md2word"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_empty = true
